name: Security Pipeline - SAST and SCA

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  sast-semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    name: Security Pipeline - SAST and SCA

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  semgrep:
    name: semgrep
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep

    steps: 
      - uses: actions/checkout@v6

      - run: semgrep ci --config semgrep-rules/no-print.yaml
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  sca-fossa:
    name: SCA - FOSSA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Rodar FOSSA
        uses: fossas/fossa-action@main
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}
    env:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar Semgrep
        run: pip install semgrep

      - name: Rodar Semgrep na plataforma
        run: semgrep ci || true

      - name: Rodar Semgrep com regra customizada
        run: semgrep scan --config semgrep-rules/no-print.yml --json --output semgrep-results.json || true

      - name: Exibir resultado do Semgrep
        run: cat semgrep-results.json

      - name: Salvar relatório do Semgrep
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.json

  sca-fossa:
    name: SCA - FOSSA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Rodar FOSSA
        uses: fossas/fossa-action@main
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}
